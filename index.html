<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plant Health App V3</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f7f1;
  margin: 0;
  padding: 20px;
  color: #1f2d1f;
}
.container {
  max-width: 1000px;
  margin: auto;
  background: #ffffff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}
h1, h2 { color: #2f6b35; }
.section {
  margin-top: 20px;
  padding: 18px;
  border: 1px solid #d7e5d4;
  border-radius: 14px;
  background: #fbfdfb;
}
label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
}
input, select, textarea, button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  border: 1px solid #b8cbb4;
  font-size: 16px;
  box-sizing: border-box;
}
button {
  background: #2f6b35;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background: #245529; }
img {
  max-width: 100%;
  margin-top: 12px;
  border-radius: 14px;
  border: 1px solid #ccc;
}
#report {
  white-space: pre-wrap;
  background: #eef6ec;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid #c9ddc5;
  min-height: 220px;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">
  <h1>🌿 Plant Health & Care Report App</h1>

  <div class="section">
    <h2>1. Add Plant Photo</h2>

    <label>Choose Image or Take Photo</label>
    <input type="file" id="imageUpload" accept="image/*" />

    <img id="preview" style="display:none;" />

    <button onclick="identifyPlant()">Identify Plant + Health Report</button>
  </div>

  <div class="section">
    <h2>2. Conditions</h2>

    <label>Sunlight</label>
    <select id="sunlight">
      <option>Full sun</option>
      <option>Partial sun</option>
      <option>Shade</option>
      <option>Not sure</option>
    </select>

    <label>Soil / Drainage</label>
    <select id="soil">
      <option>Well draining</option>
      <option>Wet/soggy</option>
      <option>Dry</option>
      <option>Clay/compact</option>
      <option>Not sure</option>
    </select>

    <label>Visible Symptoms</label>
    <textarea id="symptoms" rows="5" placeholder="Example: yellow leaves, brown under bark, black trunk, soft base, leaf spots, bugs, wilting, no leaves, etc."></textarea>

    <label>Extra Notes</label>
    <textarea id="notes" rows="4" placeholder="Example: planted last month, in wooded area, watered twice per week, recently transplanted, etc."></textarea>
  </div>

  <div class="section">
    <h2>3. Report</h2>
    <div id="report">Your report will appear here.</div>
    <button onclick="downloadReport()">Download Report</button>
  </div>
</div>

<script>
let selectedFile = null;
let imageBase64 = null;

const preview = document.getElementById("preview");

document.getElementById("imageUpload").addEventListener("change", function(e) {
  selectedFile = e.target.files[0];

  if (!selectedFile) return;

  const reader = new FileReader();

  reader.onload = function(ev) {
    imageBase64 = ev.target.result;
    preview.src = imageBase64;
    preview.style.display = "block";
  };

  reader.readAsDataURL(selectedFile);
});

async function identifyPlant() {
  if (!imageBase64) {
    alert("Please upload or take a photo first.");
    return;
  }

  const reportBox = document.getElementById("report");
  reportBox.textContent = "Analyzing plant photo and building full health report...";

  const sunlight = document.getElementById("sunlight").value;
  const soil = document.getElementById("soil").value;
  const symptoms = document.getElementById("symptoms").value;
  const notes = document.getElementById("notes").value;

  try {
    const res = await fetch("/api/identify", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        imageBase64,
        sunlight,
        soil,
        symptoms,
        notes
      })
    });

    const data = await res.json();

    if (!res.ok) {
      reportBox.textContent =
        "Error generating report.\n\n" + JSON.stringify(data, null, 2);
      return;
    }

    reportBox.textContent = data.report || "No report returned.";
  } catch (err) {
    reportBox.textContent =
      "Error connecting to API.\n\n" + err.message;
  }
}

function downloadReport() {
  const text = document.getElementById("report").textContent;
  const blob = new Blob([text], { type: "text/plain" });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "plant-health-report.txt";
  link.click();
}
</script>

</body>
</html>

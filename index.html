<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plant ID & Health App</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f7f1;
  margin: 0;
  padding: 20px;
  color: #1f2d1f;
}

.container {
  max-width: 1000px;
  margin: auto;
  background: #ffffff;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

h1, h2 {
  color: #2f6b35;
}

.section {
  margin-top: 20px;
  padding: 18px;
  border: 1px solid #d7e5d4;
  border-radius: 14px;
  background: #fbfdfb;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 12px;
}

input, select, textarea, button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 10px;
  border: 1px solid #b8cbb4;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  background: #2f6b35;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #245529;
}

video, img {
  max-width: 100%;
  margin-top: 12px;
  border-radius: 14px;
  border: 1px solid #ccc;
}

#report {
  white-space: pre-wrap;
  background: #eef6ec;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid #c9ddc5;
  min-height: 220px;
  line-height: 1.5;
}

.badge {
  display: inline-block;
  padding: 8px 12px;
  border-radius: 999px;
  background: #eef6ec;
  margin: 5px 5px 5px 0;
  border: 1px solid #c9ddc5;
}
</style>
</head>

<body>

<div class="container">
  <h1>🌿 Plant ID, Health & Yard Placement App </h1>

  <div class="section">
    <h2>1. Add Plant Photo</h2>

    <label>Choose Image or Take Photo</label>
    <!-- ✅ FIXED INPUT -->
    <input type="file" id="imageUpload" accept="image/*" />

    <img id="preview" style="display:none;" />

    <button onclick="identifyPlant()">Identify Plant + Health Report</button>
  </div>

  <div class="section">
    <h2>2. Conditions</h2>

    <label>Sunlight</label>
    <select id="sunlight">
      <option>Full sun</option>
      <option>Partial sun</option>
      <option>Shade</option>
    </select>

    <label>Soil</label>
    <select id="soil">
      <option>Well draining</option>
      <option>Wet/soggy</option>
      <option>Dry</option>
    </select>

    <label>Symptoms</label>
    <textarea id="symptoms"></textarea>
  </div>

  <div class="section">
    <h2>3. Report</h2>
    <div id="report">Your report will appear here.</div>
  </div>

</div>

<script>

let selectedFile = null;

const preview = document.getElementById("preview");

document.getElementById("imageUpload").addEventListener("change", function(e) {
  selectedFile = e.target.files[0];

  if (!selectedFile) return;

  const reader = new FileReader();
  reader.onload = function(ev) {
    preview.src = ev.target.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(selectedFile);
});

async function identifyPlant() {

  if (!selectedFile) {
    alert("Please upload or take a photo first.");
    return;
  }

  document.getElementById("report").textContent = "Analyzing...";

  try {

    const formData = new FormData();
    formData.append("file[]", selectedFile);

    const res = await fetch("/api/identify", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (!data.results || data.results.length === 0) {
      document.getElementById("report").textContent = "No plant identified.";
      return;
    }

    const plant = data.results[0];

    let name = plant.name || "Unknown";
    let scientific = plant.scientific_name || "Unknown";
    let confidence = plant.score ? Math.round(plant.score * 100) + "%" : "N/A";

    let healthScore = 100;
    let symptoms = document.getElementById("symptoms").value.toLowerCase();
    let soil = document.getElementById("soil").value;
    let sunlight = document.getElementById("sunlight").value;

    let issues = [];

    if (symptoms.includes("brown") || symptoms.includes("dead")) {
      healthScore -= 40;
      issues.push("Possible dead tissue");
    }

    if (symptoms.includes("rot")) {
      healthScore -= 30;
      issues.push("Possible rot");
    }

    if (soil.includes("Wet")) {
      healthScore -= 15;
      issues.push("Soil too wet");
    }

    if (sunlight === "Shade") {
      healthScore -= 10;
      issues.push("Low sunlight");
    }

    let status = "Healthy";
    if (healthScore < 70) status = "Stressed";
    if (healthScore < 40) status = "Critical";

    const report = `
PLANT REPORT
============

Name: ${name}
Scientific: ${scientific}
Confidence: ${confidence}

Health Score: ${healthScore}
Status: ${status}

Issues:
${issues.join("\n") || "None"}

`;

    document.getElementById("report").textContent = report;

  } catch (err) {
    console.error(err);
    document.getElementById("report").textContent = "Error connecting to API.";
  }
}

</script>

</body>
</html>
